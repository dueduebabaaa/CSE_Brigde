
name: KNU CSE Notice Crawler

on:
  push:
    branches:
      - backend
    paths:
      - 'crawler/**'
      - '.github/workflows/crawler.yml'
      - 'package.json'
      - 'package-lock.json'

  schedule:
    # 매일 한국 시간 자정 (UTC 15:00)
    - cron: "0 15 * * *"

  workflow_dispatch:

jobs:
  crawl-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crawl KNU notices
        run: node crawler/test-crawl.js

      - name: Upload notices to Supabase
        run: node crawler/upload-to-supabase.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
